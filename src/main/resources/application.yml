spring:
  application:
    name: leverage-ss

  jpa:
    defer-datasource-initialization: true
    show-sql: true
    open-in-view: false
  sql:
    init:
      mode: always

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true